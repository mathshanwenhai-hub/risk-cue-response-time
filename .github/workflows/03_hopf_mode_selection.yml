name: 03 Hopf branch and mode selection (isolated square)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'triggers/hopf_branch.txt'
      - '.github/workflows/03_hopf_mode_selection.yml'

jobs:
  branch:
    strategy:
      fail-fast: false
      matrix:
        tau: [0.612, 0.615, 0.618, 0.620]
        kind: [pure, symmetric]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          cache: true
      - name: Run near-entry branch case
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('matlab'); github_run_branch_case(${{ matrix.tau }},'${{ matrix.kind }}',5,50,0.005,2000,1e-8);
      - name: Upload branch outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: branch-${{ matrix.kind }}-tau-${{ matrix.tau }}
          path: |
            results/
            figures/
          if-no-files-found: warn
          retention-days: 30
