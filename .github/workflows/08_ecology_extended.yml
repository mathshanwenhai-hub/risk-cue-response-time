name: 08 Extended ecological diagnostics

on:
  workflow_dispatch:
  push:
    branches: [automation/numerical-validation]
    paths:
      - 'triggers/ecology_extension.txt'

jobs:
  ecology:
    strategy:
      fail-fast: false
      matrix:
        tau: [1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2025b
          cache: true
      - name: Run extended ecological case
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('matlab'); github_run_case(${{ matrix.tau }},'ecology',100,0.005,1500,'upwind',0);
      - name: Upload extended ecological outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ecology-extended-tau-${{ matrix.tau }}
          path: |
            results/
            figures/
          if-no-files-found: warn
          retention-days: 30
